name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use manifest-based configuration for monorepo
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      
      # The steps below run ONLY when a release PR is merged
      # releases_created is true AFTER merge, not when PR is created
      
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created }}
      
      - uses: pnpm/action-setup@v2
        if: ${{ steps.release.outputs.releases_created }}
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.releases_created }}
        with:
          node-version: '18'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install Dependencies
        if: ${{ steps.release.outputs.releases_created }}
        run: pnpm install --frozen-lockfile
      
      - name: Build
        if: ${{ steps.release.outputs.releases_created }}
        run: pnpm run build --filter=./packages/*
      
      - name: Publish to npm  
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          # Publish in dependency order using pnpm
          # pnpm converts workspace:* to actual versions when publishing
          cd packages/core && pnpm publish --access public --no-git-checks || true
          cd ../../packages/react && pnpm publish --access public --no-git-checks || true
          cd ../react-headless && pnpm publish --access public --no-git-checks || true
          cd ../react-shadcn && pnpm publish --access public --no-git-checks || true
          cd ../adapter-authsome && pnpm publish --access public --no-git-checks || true
          cd ../adapter-clerk && pnpm publish --access public --no-git-checks || true  
          cd ../adapter-generic && pnpm publish --access public --no-git-checks || true
          cd ../adapter-supabase && pnpm publish --access public --no-git-checks || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

